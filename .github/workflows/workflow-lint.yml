name: Workflow lint

# Its own workflow rather than a job in ci.yml: a workflow file that does not
# parse runs none of its jobs, so a lint job inside ci.yml could never report
# the one change most likely to break ci.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint (action)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository lints itself with the action it ships, so a change to
      # that action is exercised by the pull request that makes the change.
      - uses: ./actions/actionlint
