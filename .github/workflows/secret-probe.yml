name: Secret Probe

on: pull_request

permissions: {}

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report whether the organization secret arrives
        env:
          PROBE: ${{ secrets.GH_PAT_RELEASE_PLEASE_ACTION }}
        run: |
          if [ -n "${PROBE}" ]; then
            echo "secret delivered, length ${#PROBE}"
          else
            echo "secret EMPTY"
          fi
