name: actionlint
description: >-
  Lints GitHub Actions workflows with rhysd/actionlint and annotates the diff
  with what it finds.
author: TrogonStack

inputs:
  version:
    description: actionlint version to install, without the leading `v`.
    required: false
    default: "1.7.12"
  shellcheck:
    description: >-
      Install koalaman/shellcheck so actionlint also lints `run:` scripts.
      actionlint silently skips that check when shellcheck is not on `PATH`,
      so leaving this off makes self-hosted runners without shellcheck
      preinstalled disagree with ones that have it.
    required: false
    default: "true"
  config:
    description: >-
      Path to an actionlint config file, passed as `-config-file`. Leave
      empty to let actionlint auto-discover `.github/actionlint.yaml`.
    required: false
    default: ""
  args:
    description: >-
      Extra arguments for actionlint, one per line (for example `-ignore
      '...'` on its own line). Newline-separated rather than space-separated
      because an argument can itself contain spaces, and each line becomes
      exactly one argument with no further word-splitting or shell
      evaluation.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve platform
      id: platform
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            actionlint_asset=linux_amd64
            shellcheck_asset=linux.x86_64
            ;;
          Linux-ARM64)
            actionlint_asset=linux_arm64
            shellcheck_asset=linux.aarch64
            ;;
          macOS-ARM64)
            actionlint_asset=darwin_arm64
            shellcheck_asset=darwin.aarch64
            ;;
          macOS-X64)
            actionlint_asset=darwin_amd64
            shellcheck_asset=darwin.x86_64
            ;;
          *)
            echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}. This action supports Linux X64/ARM64 and macOS X64/ARM64." >&2
            exit 1
            ;;
        esac

        echo "actionlint-asset=${actionlint_asset}" >> "$GITHUB_OUTPUT"
        echo "shellcheck-asset=${shellcheck_asset}" >> "$GITHUB_OUTPUT"

    - name: Install actionlint
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ASSET: ${{ steps.platform.outputs.actionlint-asset }}
      run: |
        set -euo pipefail

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | cut -d ' ' -f 1
          else
            shasum -a 256 "$1" | cut -d ' ' -f 1
          fi
        }

        # Checksums rhysd/actionlint published for the version this action
        # defaults to. Verified offline, so the default path needs nothing
        # from the network beyond the archive itself.
        checksums="
        1.7.12 linux_amd64 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        1.7.12 linux_arm64 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        1.7.12 darwin_amd64 5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644
        1.7.12 darwin_arm64 aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f
        "

        archive="actionlint_${VERSION}_${ASSET}.tar.gz"
        url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
        dest="${RUNNER_TEMP}/actionlint/${VERSION}"
        archive_path="${RUNNER_TEMP}/${archive}"
        mkdir -p "$dest"

        curl --fail --silent --show-error --location --output "$archive_path" "$url"

        want=$(echo "$checksums" | awk -v v="$VERSION" -v a="$ASSET" '$1==v && $2==a{print $3}')
        if [ -z "$want" ]; then
          # A version this action was not pinned against: fall back to the
          # checksums file that release itself publishes, rather than
          # installing a binary nothing has verified.
          sums_url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_checksums.txt"
          sums_path="${RUNNER_TEMP}/actionlint_${VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --output "$sums_path" "$sums_url"
          want=$(awk -v f="$archive" '$2==f{print $1}' "$sums_path")
          if [ -z "$want" ]; then
            echo "::error::No checksum for ${archive} in ${sums_url}" >&2
            exit 1
          fi
        fi

        got=$(sha256_of "$archive_path")
        if [ "$got" != "$want" ]; then
          echo "::error::actionlint checksum mismatch for ${archive}: expected ${want}, got ${got}" >&2
          exit 1
        fi

        tar -xzf "$archive_path" -C "$dest" actionlint
        echo "$dest" >> "$GITHUB_PATH"

    - name: Install shellcheck
      if: inputs.shellcheck == 'true'
      shell: bash
      env:
        ASSET: ${{ steps.platform.outputs.shellcheck-asset }}
      run: |
        set -euo pipefail

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | cut -d ' ' -f 1
          else
            shasum -a 256 "$1" | cut -d ' ' -f 1
          fi
        }

        # Pinned to the one version this action ships. Letting any version
        # through unverified via an input would defeat the point of checking
        # a checksum at all; moving the pin means a new release of this
        # action.
        version="0.11.0"
        checksums="
        linux.x86_64 b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        linux.aarch64 68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
        darwin.x86_64 c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51
        darwin.aarch64 339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f
        "

        archive="shellcheck-v${version}.${ASSET}.tar.gz"
        url="https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
        dest="${RUNNER_TEMP}/shellcheck/${version}"
        archive_path="${RUNNER_TEMP}/${archive}"
        mkdir -p "$dest"

        curl --fail --silent --show-error --location --output "$archive_path" "$url"

        want=$(echo "$checksums" | awk -v a="$ASSET" '$1==a{print $2}')
        got=$(sha256_of "$archive_path")
        if [ "$got" != "$want" ]; then
          echo "::error::shellcheck checksum mismatch for ${archive}: expected ${want}, got ${got}" >&2
          exit 1
        fi

        tar -xzf "$archive_path" -C "$dest" --strip-components=1 "shellcheck-v${version}/shellcheck"
        chmod +x "${dest}/shellcheck"
        echo "$dest" >> "$GITHUB_PATH"

    - name: Register problem matcher
      shell: bash
      env:
        MATCHER_PATH: ${{ github.action_path }}/actionlint-matcher.json
      run: echo "::add-matcher::${MATCHER_PATH}"

    - name: Run actionlint
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail

        args=(-color)
        if [ -n "$CONFIG" ]; then
          args+=(-config-file "$CONFIG")
        fi
        if [ -n "$EXTRA_ARGS" ]; then
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              args+=("$line")
            fi
          done <<< "$EXTRA_ARGS"
        fi

        actionlint "${args[@]}"
