name: Conventional pull request
description: >-
  Validates that a pull request title and every non-merge commit subject follow
  Conventional Commits.
author: TrogonStack

inputs:
  types:
    description: Allowed conventional types, comma or newline separated.
    required: false
    default: |
      feat
      fix
      chore
  subject-pattern:
    description: >-
      POSIX ERE the description must match. The default rejects a leading
      uppercase letter. Set to an empty string to disable the check.
    required: false
    default: '^[^A-Z]'
  validate-title:
    description: Validate the pull request title.
    required: false
    default: 'true'
  validate-commits:
    description: >-
      Validate every non-merge commit subject. Set to false when the repository
      squash-merges and only the title reaches the default branch.
    required: false
    default: 'true'
  pr-number:
    description: >-
      Pull request number. Defaults to the one in the triggering event payload.
    required: false
    default: ''
  pr-title:
    description: >-
      Pull request title. Defaults to the one in the triggering event payload.
    required: false
    default: ''
  repository:
    description: >-
      Repository the pull request belongs to, as owner/name. Defaults to the
      repository running the workflow.
    required: false
    default: ''
  token:
    description: Token used to list the pull request commits. Needs read access only.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # This step reads the pull request through the API and never checks out or
    # executes its content. That is what makes the action safe under
    # pull_request_target. Do not add checkout, install, or build steps to the
    # job that calls it.
    - name: Validate conventional commits
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SEMCONV_TYPES: ${{ inputs.types }}
        SEMCONV_SUBJECT_PATTERN: ${{ inputs.subject-pattern }}
        SEMCONV_VALIDATE_TITLE: ${{ inputs.validate-title }}
        SEMCONV_VALIDATE_COMMITS: ${{ inputs.validate-commits }}
        SEMCONV_PR_NUMBER: ${{ inputs.pr-number }}
        SEMCONV_PR_TITLE: ${{ inputs.pr-title }}
        SEMCONV_REPOSITORY: ${{ inputs.repository }}
      run: "$GITHUB_ACTION_PATH/validate.sh"
