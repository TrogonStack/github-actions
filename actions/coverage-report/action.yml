---
# Derived from insightsengineering/coverage-action at 3179498004cf3a28cbd5b496ce580767888375b9.
# Shared report storage must preserve concurrent writers.
# yamllint disable rule:line-length
name: Code Coverage Report Action
author: Inisghts Engineering
description: Action that converts a Cobertura XML report into a markdown report.

inputs:
  token:
    description: Github token to use to publish the check.
    required: false
    default: ${{ github.token }}
  path:
    description: Path to the Cobertura coverage XML report.
    required: false
    default: coverage.xml
  source-root:
    description: Explicit source directory. By default resolve unambiguously from XML sources, report directory, or workspace; sources must match the checked-out Git commit.
    required: false
    default: ""
  threshold:
    description: The minimum allowed coverage percentage, as a real number.
    required: false
    default: 0
  fail:
    description: Fail the action when the minimum coverage was not met.
    required: false
    default: true
  publish:
    description: Publish the coverage report as an issue comment.
    required: false
    default: false
  diff:
    description: Create a diff of the coverage report.
    required: false
    default: false
  diff-branch:
    description: Branch to diff against.
    required: false
    default: main
  storage-subdirectory:
    description: Subdirectory in the diff-storage branch where the XML reports will be stored.
    required: false
    default: "."
  diff-storage:
    description: Branch where coverage reports are stored for diff purposes.
    required: false
    default: _xml_coverage_reports
  skip-diff-storage:
    description: |
      Skip all interactions with the `diff-storage` branch (fetch, diff
      generation, badge build, commit, and push). When `true`, the action
      only produces a coverage report from the input XML and does not
      require write access to the repo. The PR comment falls back to a
      text coverage line instead of the badge image.
    required: false
    default: false
  coverage-summary-title:
    description: Title for the code coverage summary in the Pull Request comment.
    required: false
    default: "Code Coverage Summary"
  uncovered-statements-increase-failure:
    description: |
      Fail the action if any changed file has an increase in uncovered lines compared to the `diff-branch`.
      This corresponds to pycobertura exit code 2, which indicates that at least one changed file has
      more uncovered lines than before (Miss > 0). Note that this is different from coverage rate
      reduction - it specifically checks for increases in the absolute number of uncovered lines.
    required: false
    default: false
  new-uncovered-statements-failure:
    description: |
      Fail the action if source changes introduce uncovered statements and no file's missed count increases.
      This corresponds to pycobertura exit code 3, including unchanged missed counts.
      To fail on all new uncovered statements, also enable `uncovered-statements-increase-failure: true`.
    required: false
    default: false
  coverage-rate-reduction-failure:
    description: |
      Fail the action if the overall coverage percentage (rate) decreases compared to the `diff-branch`.
      This is different from `uncovered-statements-increase-failure` which checks for absolute
      increases in uncovered lines. This flag specifically looks at the coverage percentage
      and fails if it goes down, regardless of whether uncovered lines increased or decreased.
      This is a more forgiving approach that focuses on the relative coverage rate rather than
      absolute uncovered line counts.
    required: false
    default: false
  pycobertura-exception-failure:
    description: Fail the action in case of a `Pycobertura` exception.
    required: false
    default: true
  togglable-report:
    description: Make the code coverage report togglable.
    required: false
    default: false
  report-low-coverage-only:
    description: |
      When true, the detailed coverage report will only include files where
      coverage is less than 100%. The TOTAL summary line is always included.
    required: false
    default: false
  exclude-detailed-coverage:
    description: |
      Whether a detailed coverage report should be excluded from the PR comment.
      The detailed coverage report contains the following information per file:
      number of code statements, number of statements not covered by any test,
      coverage percentage, and line numbers not covered by any test.
    required: false
    default: false

outputs:
  summary:
    description: Summary of coverage report
    value: ${{ steps.create-output.outputs.summary }}

branding:  # https://feathericons.com/
  icon: "umbrella"
  color: "red"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install pycobertura
      uses: insightsengineering/pip-action@905c7a9be173f62965b791e91d0079355d99f19b # v2.0.2
      with:
        packages: pycobertura==3.0.0

    - name: Get branch names
      id: branch-names
      uses: tj-actions/branch-names@6c999acf206f5561e19f46301bb310e9e70d8815 # v7.0.7

    - name: Generate text report
      run: |
        mkdir -p coverage-action
        cp "${COVERAGE_INPUTS_PATH}" coverage-action/
        pycobertura show "${COVERAGE_INPUTS_PATH}" --output .coverage-output
        if [[ "${COVERAGE_INPUTS_REPORT_LOW_COVERAGE_ONLY}" == "true" ]]
        then {
          # Keep header lines, the TOTAL line, and any file with missed lines (Miss != 0)
          awk 'NR<=2 || /^TOTAL / || $3 != 0' .coverage-output > .coverage-output.filtered
          mv .coverage-output.filtered .coverage-output
        }
        fi
        cat .coverage-output
      shell: bash
      env:
        COVERAGE_INPUTS_PATH: ${{ inputs.path }}
        COVERAGE_INPUTS_REPORT_LOW_COVERAGE_ONLY: ${{ inputs.report-low-coverage-only }}

    - name: Capture report sources
      id: capture
      if: contains(inputs.diff, 'true') && inputs.skip-diff-storage != 'true'
      run: |
        rm -f coverage-action/sources.json
        status=0
        python3 "$COVERAGE_HELPER" capture --report "$COVERAGE_INPUTS_PATH" --output coverage-action/sources.json --source-root "$COVERAGE_SOURCE_ROOT" || status=1
        echo "status=$status" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        COVERAGE_HELPER: ${{ github.action_path }}/report.py
        COVERAGE_INPUTS_PATH: ${{ inputs.path }}
        COVERAGE_SOURCE_ROOT: ${{ inputs.source-root }}
        COVERAGE_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}

    - name: Fetch report from ${{ inputs.diff-storage }}
      if: inputs.skip-diff-storage != 'true'
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        path: ${{ inputs.diff-storage }}
        fetch-depth: 0
        token: ${{ inputs.token }}
        persist-credentials: true

    - name: Get token identity
      if: inputs.skip-diff-storage != 'true'
      id: identity
      uses: octokit/graphql-action@f7836e89a7e5bac63911bbe9653c21147b3d9bc3
      with:
        query: |
          query {
            viewer {
              databaseId
              login
            }
          }
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Configure git
      if: inputs.skip-diff-storage != 'true'
      run: |
        name="${COVERAGE_GIT_NAME}"
        email="${COVERAGE_GIT_EMAIL}"

        cat >> "$GITHUB_ENV" << EOF
        GIT_AUTHOR_NAME=$name
        GIT_AUTHOR_EMAIL=$email
        GIT_COMMITTER_NAME=$name
        GIT_COMMITTER_EMAIL=$email
        EOF
      shell: bash
      env:
        COVERAGE_GIT_NAME: ${{ fromJSON(steps.identity.outputs.data).viewer.login }}
        COVERAGE_GIT_EMAIL: ${{ format('{0}+{1}@users.noreply.github.com', fromJSON(steps.identity.outputs.data).viewer.databaseId, fromJSON(steps.identity.outputs.data).viewer.login) }}

    - name: Initialize storage branch
      if: inputs.skip-diff-storage != 'true'
      working-directory: ${{ inputs.diff-storage }}
      run: |
        # Switch to the branch if it already exists
        git switch "${COVERAGE_INPUTS_DIFF_STORAGE}" || true
        git pull origin "${COVERAGE_INPUTS_DIFF_STORAGE}" || true
        # Create the branch if it doesn't exist yet
        git checkout --orphan "${COVERAGE_INPUTS_DIFF_STORAGE}" || true
        # Ensure that the bare minimum components exist in the branch
        mkdir -p data
        touch README.md data/.gitkeep
        # Copy necessary files and folders to a temporary location
        mkdir -p "/tmp/${COVERAGE_GITHUB_SHA}"
        echo "Copying data to /tmp/${COVERAGE_GITHUB_SHA}"
        cp -r .git README.md data "/tmp/${COVERAGE_GITHUB_SHA}"
        # Remove everything else
        # Attribution: https://unix.stackexchange.com/a/77313
        rm -rf -- ..?* .[!.]* *
        # Restore files from the temporary location
        echo "Copying data from /tmp/${COVERAGE_GITHUB_SHA}"
        cp -r "/tmp/${COVERAGE_GITHUB_SHA}/.git" "/tmp/${COVERAGE_GITHUB_SHA}/README.md" "/tmp/${COVERAGE_GITHUB_SHA}/data" .
        rm -rf "/tmp/${COVERAGE_GITHUB_SHA}"
        git add --all -f
        git commit -m "Update storage branch: $(date)" || true
      shell: bash
      env:
        COVERAGE_INPUTS_DIFF_STORAGE: ${{ inputs.diff-storage }}
        COVERAGE_GITHUB_SHA: ${{ github.sha }}

    - name: Push storage branch
      if: inputs.skip-diff-storage != 'true'
      run: python3 "$COVERAGE_PUBLISHER" --directory "$COVERAGE_STORAGE_DIRECTORY" --branch "$COVERAGE_STORAGE_BRANCH"
      shell: bash
      env:
        COVERAGE_PUBLISHER: ${{ github.action_path }}/publish.py
        COVERAGE_STORAGE_DIRECTORY: ${{ inputs.diff-storage }}
        COVERAGE_STORAGE_BRANCH: ${{ inputs.diff-storage }}

    - name: Generate diff against ${{ inputs.diff-branch }}
      if: contains(inputs.diff, 'true') && inputs.skip-diff-storage != 'true'
      id: comparison
      run: |
        rm -f .coverage-output.diff
        status=0
        baseline="${COVERAGE_INPUTS_DIFF_STORAGE}/data/${COVERAGE_INPUTS_DIFF_BRANCH}/${COVERAGE_INPUTS_STORAGE_SUBDIRECTORY}/coverage.xml"
        if [[ -f "$baseline" ]]; then
          python3 "$COVERAGE_HELPER" diff --baseline "$baseline" --current "$COVERAGE_INPUTS_PATH" --current-sources coverage-action/sources.json --output .coverage-output.diff || status=$?
          if [[ "$status" != 0 && "$status" != 2 && "$status" != 3 ]]; then status=1; fi
          if [[ -f .coverage-output.diff ]]; then cat .coverage-output.diff; fi
        else
          echo "Baseline report not found; skipping comparison."
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        COVERAGE_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        COVERAGE_HELPER: ${{ github.action_path }}/report.py
        COVERAGE_INPUTS_STORAGE_SUBDIRECTORY: ${{ inputs.storage-subdirectory }}
        COVERAGE_INPUTS_DIFF_STORAGE: ${{ inputs.diff-storage }}
        COVERAGE_INPUTS_DIFF_BRANCH: ${{ inputs.diff-branch }}
        COVERAGE_INPUTS_PATH: ${{ inputs.path }}

    - name: Extract diff-branch coverage percentage
      id: baseline
      if: contains(inputs.diff, 'true') && contains(inputs.coverage-rate-reduction-failure, 'true') && inputs.skip-diff-storage != 'true'
      run: |
        rm -f .coverage-output.diff-branch .coverage-total.diff-branch
        status=0
        baseline="${COVERAGE_INPUTS_DIFF_STORAGE}/data/${COVERAGE_INPUTS_DIFF_BRANCH}/${COVERAGE_INPUTS_STORAGE_SUBDIRECTORY}/coverage.xml"
        if [[ -f "$baseline" ]]; then
          if pycobertura show "$baseline" --output .coverage-output.diff-branch && python3 "$COVERAGE_HELPER" percent .coverage-output.diff-branch > .coverage-total.diff-branch; then
            echo "Diff-branch coverage: $(cat .coverage-total.diff-branch)%"
          else
            status=1
            rm -f .coverage-output.diff-branch .coverage-total.diff-branch
          fi
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        COVERAGE_HELPER: ${{ github.action_path }}/report.py
        COVERAGE_INPUTS_DIFF_STORAGE: ${{ inputs.diff-storage }}
        COVERAGE_INPUTS_DIFF_BRANCH: ${{ inputs.diff-branch }}
        COVERAGE_INPUTS_STORAGE_SUBDIRECTORY: ${{ inputs.storage-subdirectory }}

    - name: Get total
      run: python3 "$COVERAGE_HELPER" percent .coverage-output > .coverage-total
      shell: bash
      env:
        COVERAGE_HELPER: ${{ github.action_path }}/report.py

    - name: Store coverage percent
      id: coverage_percent
      run: |
        echo "coverage_total=$(cat .coverage-total)" >> "$GITHUB_OUTPUT"
        BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        if [[ -n "$GITHUB_HEAD_REF" && "${COVERAGE_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
          [[ "$COVERAGE_HEAD_REPOSITORY_ID" =~ ^[0-9]+$ && "$COVERAGE_PR_NUMBER" =~ ^[0-9]+$ ]]
          BRANCH=".forks/${COVERAGE_HEAD_REPOSITORY_ID}/${COVERAGE_PR_NUMBER}"
        fi
        echo "diff_storage_branch=$BRANCH" >> "$GITHUB_OUTPUT"
        mkdir -p "${COVERAGE_INPUTS_DIFF_STORAGE}/data/${BRANCH}/${COVERAGE_INPUTS_STORAGE_SUBDIRECTORY}"
      shell: bash

      env:
        COVERAGE_INPUTS_DIFF_STORAGE: ${{ inputs.diff-storage }}
        COVERAGE_INPUTS_STORAGE_SUBDIRECTORY: ${{ inputs.storage-subdirectory }}
        COVERAGE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        COVERAGE_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
        COVERAGE_PR_NUMBER: ${{ github.event.pull_request.number }}

    # Use the output from the `coverage_percent` step
    - name: Generate the badge SVG image
      if: inputs.skip-diff-storage != 'true'
      uses: emibcn/badge-action@808173dd03e2f30c980d03ee49e181626088eee8 # v2.0.3
      id: badge
      with:
        label: 'Test Coverage'
        status: "${{ steps.coverage_percent.outputs.coverage_total }}%"
        color: ${{
          steps.coverage_percent.outputs.coverage_total > 90 && 'green'              ||
          steps.coverage_percent.outputs.coverage_total > 80 && 'yellow,green'       ||
          steps.coverage_percent.outputs.coverage_total > 70 && 'yellow'             ||
          steps.coverage_percent.outputs.coverage_total > 60 && 'orange,yellow'      ||
          steps.coverage_percent.outputs.coverage_total > 50 && 'orange'             ||
          steps.coverage_percent.outputs.coverage_total > 40 && 'red,orange'         ||
          steps.coverage_percent.outputs.coverage_total > 30 && 'red,red,orange'     ||
          steps.coverage_percent.outputs.coverage_total > 20 && 'red,red,red,orange' ||
          'red' }}
        path: ${{ inputs.diff-storage }}/data/${{ steps.coverage_percent.outputs.diff_storage_branch }}/${{ inputs.storage-subdirectory }}/badge.svg

    - name: Commit badge
      if: inputs.skip-diff-storage != 'true'
      working-directory: ${{ inputs.diff-storage }}/data
      run: |
        git switch "${COVERAGE_INPUTS_DIFF_STORAGE}" || true
        git pull origin "${COVERAGE_INPUTS_DIFF_STORAGE}"
        git add "${COVERAGE_ENV_DIFF_STORAGE_BRANCH}/${COVERAGE_INPUTS_STORAGE_SUBDIRECTORY}/badge.svg"
        git commit -m "Add/Update badge: ${COVERAGE_GITHUB_SHA}" || true
      shell: bash

      env:
        COVERAGE_INPUTS_DIFF_STORAGE: ${{ inputs.diff-storage }}
        COVERAGE_ENV_DIFF_STORAGE_BRANCH: ${{ steps.coverage_percent.outputs.diff_storage_branch }}
        COVERAGE_INPUTS_STORAGE_SUBDIRECTORY: ${{ inputs.storage-subdirectory }}
        COVERAGE_GITHUB_SHA: ${{ github.sha }}

    # Badge has to be committed and pushed to be used in comment
    - name: Push badges
      if: inputs.skip-diff-storage != 'true'
      run: python3 "$COVERAGE_PUBLISHER" --directory "$COVERAGE_STORAGE_DIRECTORY" --branch "$COVERAGE_STORAGE_BRANCH"
      shell: bash
      env:
        COVERAGE_PUBLISHER: ${{ github.action_path }}/publish.py
        COVERAGE_STORAGE_DIRECTORY: ${{ inputs.diff-storage }}
        COVERAGE_STORAGE_BRANCH: ${{ inputs.diff-storage }}

    - name: Determine repository visibility
      if: contains(inputs.publish, 'true')
      id: repository-visibility
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      with:
        script: |
          const result = await github.rest.repos.get({
            owner: "${{ github.repository_owner }}",
            repo: "${{ github.repository }}".split("/")[1]
          });
          return result.data.visibility;
        result-encoding: string

    - name: Generate issue comment body
      run: |
        if [[ "${COVERAGE_STEPS_REPOSITORY_VISIBILITY_OUTPUTS_RESULT}" == "public" && "${COVERAGE_INPUTS_SKIP_DIFF_STORAGE}" != "true" ]]
        then {
          # URL encoding for branch name
          URL_ENCODED_BRANCH=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote_plus(os.environ["COVERAGE_ENV_DIFF_STORAGE_BRANCH"]))')
          echo -e "![badge](https://raw.githubusercontent.com/${COVERAGE_GITHUB_REPOSITORY_OWNER}/${COVERAGE_GITHUB_EVENT_REPOSITORY_NAME}/${COVERAGE_INPUTS_DIFF_STORAGE}/data/${URL_ENCODED_BRANCH}/${COVERAGE_INPUTS_STORAGE_SUBDIRECTORY}/badge.svg)\n\n" > .coverage-output.final
        }
        else {
          echo -e "🧪 Test coverage: ${COVERAGE_STEPS_COVERAGE_PERCENT_OUTPUTS_COVERAGE_TOTAL}%\n\n" > .coverage-output.final
        }
        fi
        echo -e "## ${COVERAGE_INPUTS_COVERAGE_SUMMARY_TITLE}\n" >> .coverage-output.final
        if [[ "${COVERAGE_INPUTS_EXCLUDE_DETAILED_COVERAGE}" == "false" ]]
        then {
          if [[ "${COVERAGE_INPUTS_TOGGLABLE_REPORT}" == "true" ]]
          then {
            echo -e "<details>\n\n" >> .coverage-output.final
          }
          fi
          {
            echo -e "\`\`\`"
            cat .coverage-output
            echo -e "\n\`\`\`\n"
          } >> .coverage-output.final
          if [[ "${COVERAGE_INPUTS_TOGGLABLE_REPORT}" == "true" ]]
          then {
            echo -e "</details>\n\n" >> .coverage-output.final
          }
          fi
        }
        else {
          echo -e "\n" >> .coverage-output.final
        }
        fi
        if [[ "${COVERAGE_INPUTS_DIFF}" == "true" && -f .coverage-output.diff ]]
        then {
          {
            echo -e "### Diff against ${COVERAGE_INPUTS_DIFF_BRANCH}\n"
            echo -e "\`\`\`"
            cat .coverage-output.diff
            echo -e "\n\`\`\`\n"
          } >> .coverage-output.final
        }
        fi
        COMMIT_SHA="${COVERAGE_GITHUB_SHA}"
        if [ "${COVERAGE_GITHUB_EVENT_NAME}" == "pull_request" ]
        then {
          COMMIT_SHA="${COVERAGE_GITHUB_EVENT_PULL_REQUEST_HEAD_SHA}"
        }
        fi
        {
          echo -e "\nResults for commit: $COMMIT_SHA\n"
          echo -e "\n_Minimum allowed coverage is \`${COVERAGE_INPUTS_THRESHOLD}%\`_\n"
        } >> .coverage-output.final
        if [[ "${COVERAGE_INPUTS_PUBLISH}" == "true" ]]
        then {
          echo -e "\n:recycle: This comment has been updated with latest results\n" >> .coverage-output.final
        }
        fi
      shell: bash
      env:
        COVERAGE_STEPS_REPOSITORY_VISIBILITY_OUTPUTS_RESULT: ${{ steps.repository-visibility.outputs.result }}
        COVERAGE_INPUTS_SKIP_DIFF_STORAGE: ${{ inputs.skip-diff-storage }}
        COVERAGE_ENV_DIFF_STORAGE_BRANCH: ${{ steps.coverage_percent.outputs.diff_storage_branch }}
        COVERAGE_GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        COVERAGE_GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
        COVERAGE_INPUTS_DIFF_STORAGE: ${{ inputs.diff-storage }}
        COVERAGE_INPUTS_STORAGE_SUBDIRECTORY: ${{ inputs.storage-subdirectory }}
        COVERAGE_STEPS_COVERAGE_PERCENT_OUTPUTS_COVERAGE_TOTAL: ${{ steps.coverage_percent.outputs.coverage_total }}
        COVERAGE_INPUTS_COVERAGE_SUMMARY_TITLE: ${{ inputs.coverage-summary-title }}
        COVERAGE_INPUTS_EXCLUDE_DETAILED_COVERAGE: ${{ inputs.exclude-detailed-coverage }}
        COVERAGE_INPUTS_TOGGLABLE_REPORT: ${{ inputs.togglable-report }}
        COVERAGE_INPUTS_DIFF: ${{ inputs.diff }}
        COVERAGE_INPUTS_DIFF_BRANCH: ${{ inputs.diff-branch }}
        COVERAGE_GITHUB_SHA: ${{ github.sha }}
        COVERAGE_GITHUB_EVENT_NAME: ${{ github.event_name }}
        COVERAGE_GITHUB_EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        COVERAGE_INPUTS_THRESHOLD: ${{ inputs.threshold }}
        COVERAGE_INPUTS_PUBLISH: ${{ inputs.publish }}

    - name: Post as comment
      if: contains(inputs.publish, 'true')
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        GITHUB_TOKEN: ${{ inputs.token }}
        header: ${{ inputs.path }}
        path: .coverage-output.final

    - name: Set as output
      id: create-output
      run: |
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        summary=$(cat .coverage-output.final) || summary=""
        {
          echo "summary<<$EOF"
          printf '%s\n' "$summary"
          echo "$EOF"
        } >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Commit XML report to ${{ inputs.diff-storage }}
      if: >
        contains(inputs.diff, 'true') && inputs.skip-diff-storage != 'true'
      working-directory: ${{ inputs.diff-storage }}
      run: |
        if [[ ! -f "${GITHUB_WORKSPACE}/coverage-action/sources.json" ]]; then
          echo "Source capture unavailable; not replacing the stored report."
          exit 0
        fi
        git switch "${COVERAGE_INPUTS_DIFF_STORAGE}"
        git pull origin "${COVERAGE_INPUTS_DIFF_STORAGE}"
        filename=$(basename "${COVERAGE_INPUTS_PATH}")
        mv "${GITHUB_WORKSPACE}/coverage-action/${filename}" "./data/${COVERAGE_ENV_DIFF_STORAGE_BRANCH}/${COVERAGE_INPUTS_STORAGE_SUBDIRECTORY}/coverage.xml"
        destination="./data/${COVERAGE_ENV_DIFF_STORAGE_BRANCH}/${COVERAGE_INPUTS_STORAGE_SUBDIRECTORY}"
        mv "${GITHUB_WORKSPACE}/coverage-action/sources.json" "$destination/sources.json"
        git add -f "$destination/coverage.xml" "$destination/sources.json"
        git commit -m "Coverage report for ${COVERAGE_GITHUB_SHA}" || true
      shell: bash
      env:
        COVERAGE_INPUTS_DIFF_STORAGE: ${{ inputs.diff-storage }}
        COVERAGE_INPUTS_PATH: ${{ inputs.path }}
        COVERAGE_ENV_DIFF_STORAGE_BRANCH: ${{ steps.coverage_percent.outputs.diff_storage_branch }}
        COVERAGE_INPUTS_STORAGE_SUBDIRECTORY: ${{ inputs.storage-subdirectory }}
        COVERAGE_GITHUB_SHA: ${{ github.sha }}

    - name: Push XML report to ${{ inputs.diff-storage }}
      if: >
        contains(inputs.diff, 'true') && inputs.skip-diff-storage != 'true'
      run: python3 "$COVERAGE_PUBLISHER" --directory "$COVERAGE_STORAGE_DIRECTORY" --branch "$COVERAGE_STORAGE_BRANCH"
      shell: bash
      env:
        COVERAGE_PUBLISHER: ${{ github.action_path }}/publish.py
        COVERAGE_STORAGE_DIRECTORY: ${{ inputs.diff-storage }}
        COVERAGE_STORAGE_BRANCH: ${{ inputs.diff-storage }}

    - name: Check threshold
      if: contains(inputs.fail, 'true')
      run: python3 "$COVERAGE_HELPER" threshold
      shell: bash
      env:
        COVERAGE_HELPER: ${{ github.action_path }}/report.py
        COVERAGE_INPUTS_THRESHOLD: ${{ inputs.threshold }}

    - name: Fail if coverage worsened
      if: contains(inputs.diff, 'true') && inputs.skip-diff-storage != 'true'
      run: python3 "$COVERAGE_HELPER" gate
      shell: bash
      env:
        COVERAGE_HELPER: ${{ github.action_path }}/report.py
        COVERAGE_ENV_PYCOBERTURA_STATUS: ${{ steps.comparison.outputs.status }}
        COVERAGE_BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
        COVERAGE_CAPTURE_STATUS: ${{ steps.capture.outputs.status }}
        COVERAGE_INPUTS_UNCOVERED_STATEMENTS_INCREASE_FAILURE: ${{ inputs.uncovered-statements-increase-failure }}
        COVERAGE_INPUTS_NEW_UNCOVERED_STATEMENTS_FAILURE: ${{ inputs.new-uncovered-statements-failure }}
        COVERAGE_INPUTS_PYCOBERTURA_EXCEPTION_FAILURE: ${{ inputs.pycobertura-exception-failure }}
        COVERAGE_INPUTS_COVERAGE_RATE_REDUCTION_FAILURE: ${{ inputs.coverage-rate-reduction-failure }}

    - name: Clean up intermediate files
      if: always()
      run: |
        rm -rf coverage-action .coverage-output.final .coverage-output \
          .coverage-total .coverage-output.diff \
          .coverage-output.diff-branch .coverage-total.diff-branch \
          "${COVERAGE_INPUTS_DIFF_STORAGE}-not-found"
      shell: bash
      env:
        COVERAGE_INPUTS_DIFF_STORAGE: ${{ inputs.diff-storage }}
